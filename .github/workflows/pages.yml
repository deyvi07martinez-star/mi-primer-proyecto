name: Publicar la pagina de la liga

# Publica la carpeta site/ en GitHub Pages cada vez que cambia en main.
# configure-pages con enablement: true enciende Pages solo la primera vez,
# asi no hay que tocar nada a mano en los ajustes del repositorio.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar la carpeta site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
