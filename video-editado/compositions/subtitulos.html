<template>
  <style>
    @font-face {
      font-family: "DM Sans";
      font-weight: 700;
      src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* Banda segura: debajo del pecho y por encima de la interfaz de Reels/TikTok (1330 px) */
    .sub {
      position: absolute;
      left: 0;
      right: 0;
      top: 1215px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0 22px;
      overflow: visible;
      font-family: "DM Sans", sans-serif;
      font-weight: 700;
      font-size: 80px;
      line-height: 1;
      letter-spacing: -1px;
      color: #fff9ee;
      text-shadow:
        0 3px 0 rgba(11, 29, 58, 0.85),
        0 8px 26px rgba(3, 10, 24, 0.75),
        0 0 4px rgba(3, 10, 24, 0.6);
    }
    .sub span {
      display: inline-block;
    }
    .sub .clave {
      color: #ffe08a;
    }
  </style>

  <div id="root" data-composition-id="subtitulos" data-width="1080" data-height="1920">
    <div id="sub-20" class="sub clip" data-start="20.1" data-duration="0.97"><span>así</span><span>que</span><span class="clave">traigan</span></div>
    <div id="sub-21" class="sub clip" data-start="21.07" data-duration="0.73"><span>su</span><span class="clave">bate</span><span>para</span></div>
    <div id="sub-22" class="sub clip" data-start="21.8" data-duration="0.82"><span>cambiarle</span><span>los</span><span class="clave">grips</span></div>
    <div id="sub-23" class="sub clip" data-start="22.62" data-duration="0.84"><span>pónganselo</span><span class="clave">nuevo</span></div>
    <div id="sub-24" class="sub clip" data-start="23.46" data-duration="1.14"><span>y</span><span>tenemos</span><span class="clave">brea</span></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Cada palabra entra con un desenfoque breve, 70 ms entre palabras; la clave rebota apenas
    document.querySelectorAll("#root .sub").forEach((g) => {
      const t0 = parseFloat(g.dataset.start);
      g.querySelectorAll("span").forEach((w, i) => {
        tl.fromTo(
          w,
          { opacity: 0, y: 14, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
          t0 + i * 0.07,
        );
        if (w.classList.contains("clave")) {
          tl.fromTo(w, { scale: 1 }, { scale: 1.1, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + i * 0.07 + 0.05);
        }
      });
    });

    window.__timelines["subtitulos"] = tl;
  </script>
</template>
