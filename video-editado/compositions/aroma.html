<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* Volutas de aroma a la izquierda de tu cara, subiendo desde el spray */
    #aroma-svg {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }
    .voluta {
      fill: none;
      stroke-linecap: round;
    }
    .destello {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbe9 0%, #ffe08a 40%, rgba(255, 224, 138, 0) 72%);
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="aroma" data-width="1080" data-height="1920">
    <svg id="aroma-svg" viewBox="0 0 1080 1920">
      <defs>
        <filter id="aroma-sombra" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#030a18" flood-opacity="0.45" />
        </filter>
      </defs>
      <g id="aroma-grupo" filter="url(#aroma-sombra)">
        <path id="vol-1" class="voluta" stroke="#ffe08a" stroke-opacity="0.85" stroke-width="16" d="M430 1160 C 360 1080, 470 1010, 380 930 S 300 800, 360 720 S 300 620, 240 600" />
        <path id="vol-2" class="voluta" stroke="#7fb8f0" stroke-opacity="0.7" stroke-width="11" d="M400 1180 C 320 1120, 400 1040, 310 980 S 220 860, 280 780 S 220 690, 170 660" />
        <path id="vol-3" class="voluta" stroke="#fff9ee" stroke-opacity="0.6" stroke-width="7" d="M450 1150 C 420 1060, 520 1020, 440 950 S 380 860, 420 800" />
      </g>
    </svg>
    <div class="destello" id="de-1" style="left: 300px; top: 900px"></div>
    <div class="destello" id="de-2" style="left: 210px; top: 760px"></div>
    <div class="destello" id="de-3" style="left: 380px; top: 820px"></div>
    <div class="destello" id="de-4" style="left: 160px; top: 640px"></div>
    <div class="destello" id="de-5" style="left: 330px; top: 690px"></div>
    <div class="destello" id="de-6" style="left: 250px; top: 1010px"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Cada voluta se dibuja de abajo hacia arriba y sigue subiendo
    [["#vol-1", 0.25], ["#vol-2", 0.4], ["#vol-3", 0.55]].forEach(([sel, t]) => {
      const largo = document.querySelector(sel).getTotalLength();
      tl.fromTo(sel, { strokeDasharray: largo, strokeDashoffset: largo, opacity: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, t);
    });
    tl.fromTo("#aroma-grupo", { y: 0 }, { y: -90, duration: 1.6, ease: "sine.out" }, 0.25);
    tl.to(["#vol-1", "#vol-2", "#vol-3"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 1.4);

    // Destellos que titilan (tiempos fijos)
    ["#de-1", "#de-2", "#de-3", "#de-4", "#de-5", "#de-6"].forEach((sel, i) => {
      const t = 0.45 + i * 0.13;
      tl.fromTo(sel, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.4, duration: 0.2, ease: "power2.out" }, t);
      tl.to(sel, { opacity: 0, scale: 0.5, y: -40, duration: 0.4, ease: "power2.in" }, t + 0.2);
    });

    window.__timelines["aroma"] = tl;
  </script>
</template>
