<template>
  <style>
    #root {
      position: absolute;

    #aro-space {

  <div id="root" data-composition-id="aro" data-width="1080" data-height="1920">

  <script>
    const tl = gsap.timeline({ paused: true });

    // Los aros se abren alrededor de la ventana, inclinados en perspectiva
    tl.fromTo("#aro-1", { opacity: 0, scale: 0.55, rotationX: 72, rotationY: -8 }, { opacity: 1, scale: 1, rotationX: 70, rotationY: -8, duration: 0.7, ease: "expo.out" }, 0.45);
