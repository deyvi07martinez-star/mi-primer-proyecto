<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1d3a;
      }
      :root {
        --navy: #0b1d3a;
        --deep: #1e3a6e;
        --sky: #7fb8f0;
        --ink: #fff9ee;
        --yellow: #ffe08a;
        --red: #f2545b;
        --green: #3dd68c;
      }
      /* Escenario azul marino detrás de la cámara: se ve cuando la toma se encoge */
      #stage {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 90% 55% at 50% 38%, #1e3a6e 0%, #102a52 45%, #0b1d3a 80%),
          #0b1d3a;
        overflow: hidden;
      }
      #stage-floor {
        position: absolute;
        left: -540px;
        right: -540px;
        top: 1180px;
        height: 1400px;
        background-image:
          linear-gradient(rgba(127, 184, 240, 0.22) 2px, transparent 2px),
          linear-gradient(90deg, rgba(127, 184, 240, 0.22) 2px, transparent 2px);
        background-size: 120px 120px;
        transform-origin: 50% 0%;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
        mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
      }
      #stage-glow {
        position: absolute;
        left: 140px;
        top: 260px;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 224, 138, 0.16) 0%, transparent 65%);
      }
      #cam-space {
        position: absolute;
        inset: 0;
        perspective: 1800px;
        perspective-origin: 50% 45%;
      }
      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
        box-shadow:
          0 60px 120px rgba(3, 10, 24, 0.75),
          0 18px 40px rgba(3, 10, 24, 0.55);
      }
      #cam video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Brillo de borde y reflejo de vidrio para la ventana */
      #cam-rim {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 6px rgba(127, 184, 240, 0.55);
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.16) 0%, transparent 28%);
        pointer-events: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Estados de cámara. A = completa; B = dividida (gráfico arriba, tú abajo);
      // C/D = ventana 3D sobre el escenario azul marino.
      const A = { x: 0, y: 0, scale: 1, rotationY: 0, rotationX: 0, borderRadius: 0, clipPath: "inset(0px 0px 0px 0px round 0px)" };
      const B = (y, top) => ({ x: 0, y, scale: 1, rotationY: 0, rotationX: 0, borderRadius: 0, clipPath: `inset(${top}px 0px 0px 0px round 56px)` });
      const ventana = (v) => Object.assign({ clipPath: "inset(0px 0px 0px 0px round 0px)" }, v);

      tl.set("#cam", Object.assign({ z: 0 }, A), 0);
      tl.set("#stage-floor", { rotationX: 62, y: 0 }, 0);

      // Fondo: deriva lenta del piso para que el escenario nunca quede congelado
      tl.fromTo("#stage-floor", { backgroundPositionY: "0px" }, { backgroundPositionY: "390px", duration: 32, ease: "none" }, 0);

      // 1 · Gancho (0–3,4) · A: acercamiento lento
      tl.to("#cam", { scale: 1.06, y: -18, duration: 3.2, ease: "sine.inOut" }, 0.15);

      // 2 · Prueba (3,4–7,1) · D: ventana inclinada con la toma del pelotero; el corte (3,9) cae a mitad del movimiento
      tl.to("#cam", Object.assign({ duration: 0.6, ease: "power3.inOut" }, ventana({ x: 0, y: -240, scale: 0.5, rotationY: -8, rotationX: 3, borderRadius: 80 })), 3.45);
      tl.to("#cam-rim", { opacity: 1, duration: 0.35, ease: "power2.out" }, 3.65);
      tl.to("#cam", { rotationY: 6, rotationX: 1, scale: 0.515, duration: 2.8, ease: "sine.inOut" }, 4.05);

      // 3 · Contraste (7,1–9,4) · B
      tl.to("#cam", Object.assign({ duration: 0.45, ease: "power3.inOut" }, B(400, 560)), 6.9);
      tl.to("#cam-rim", { opacity: 0, duration: 0.2 }, 6.95);
      tl.to("#cam", { scale: 1.035, duration: 1.9, ease: "sine.inOut" }, 7.35);

      // 4 · Transición (9,4–12,2) · A: vuelta con barrido, empuje y rebote en el corte de 11,7
      tl.to("#cam", Object.assign({ duration: 0.35, ease: "power3.out" }, A), 9.3);
      tl.to("#cam", { scale: 1.08, duration: 1.9, ease: "sine.inOut" }, 9.7);
      tl.to("#cam", { scale: 1, duration: 0.25, ease: "power2.inOut" }, 11.6);

      // 5 · Ejemplo (12,2–14,6) · C: la vitrina en una ventana con el aro de luz
      tl.to("#cam", Object.assign({ duration: 0.55, ease: "power3.inOut" }, ventana({ x: 0, y: -180, scale: 0.62, rotationY: -6, rotationX: 4, borderRadius: 64 })), 12.1);
      tl.to("#cam-rim", { opacity: 1, duration: 0.35 }, 12.3);
      tl.to("#cam", { rotationY: 5, scale: 0.63, duration: 1.7, ease: "sine.inOut" }, 12.65);

      // 6 · Ejemplo (14,6–16,4) · A: acercamiento al spray
      tl.to("#cam", Object.assign({ duration: 0.4, ease: "power3.out" }, A), 14.4);
      tl.to("#cam-rim", { opacity: 0, duration: 0.2 }, 14.45);
      tl.to("#cam", { scale: 1.1, y: -60, duration: 1.4, ease: "sine.inOut" }, 14.85);

      // 7 · Prueba (16,4–18,3) · B: logo real de Lizard Skins arriba
      tl.to("#cam", Object.assign({ duration: 0.45, ease: "power3.inOut" }, B(440, 520)), 16.3);
      tl.to("#cam", { scale: 1.03, duration: 1.35, ease: "sine.inOut" }, 16.8);

      // 8 · Ejemplo (18,3–20,1) · C: ventana a la izquierda, abanico de colores reales a la derecha
      tl.to("#cam", Object.assign({ duration: 0.5, ease: "power3.inOut" }, ventana({ x: -200, y: -100, scale: 0.55, rotationY: 12, rotationX: 2, borderRadius: 70 })), 18.2);
      tl.to("#cam-rim", { opacity: 1, duration: 0.35 }, 18.4);
      tl.to("#cam", { rotationY: 8, y: -112, duration: 1.2, ease: "sine.inOut" }, 18.75);

      // 9 · Pasos (20,1–24,6) · C → D (escena de prueba aprobada)
      // Modo C: la toma se encoge a una ventana a la derecha, girada hacia las tarjetas
      tl.to("#cam", { x: 342, y: -90, scale: 0.315, rotationY: -14, borderRadius: 114, duration: 0.6, ease: "power2.inOut" }, 20.1);
      // micro-movimiento dentro del modo
      tl.to("#cam", { y: -106, rotationY: -10, duration: 1.2, ease: "sine.inOut" }, 20.7);

      // Modo D: la ventana crece al centro justo en el corte a la toma del cambio de grip (22,3)
      tl.to("#cam", { x: 0, y: -205, scale: 0.47, rotationY: 7, rotationX: 4, borderRadius: 78, duration: 0.55, ease: "power3.inOut" }, 21.95);
      tl.to("#cam", { rotationY: 2, rotationX: 2, scale: 0.48, duration: 1.6, ease: "sine.inOut" }, 22.6);

      // 10 · Dato (24,6–28,0) · B: lupa sobre el spray real
      tl.to("#cam", Object.assign({ duration: 0.45, ease: "power3.inOut" }, B(400, 560)), 24.2);
      tl.to("#cam-rim", { opacity: 0, duration: 0.2 }, 24.3);
      tl.to("#cam", { scale: 1.03, duration: 3.15, ease: "sine.inOut" }, 24.7);

      // 11 · Llamada a la acción (28,0–31,4) · A → tarjeta final
      tl.to("#cam", Object.assign({ duration: 0.4, ease: "power2.inOut" }, A), 27.9);
      tl.to("#cam", { scale: 1.06, duration: 0.6, ease: "sine.inOut" }, 28.35);

      window.__timelines["main"] = tl;
    </script>
